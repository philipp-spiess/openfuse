services:
  test-node:
    # Native arm64 — fuse-native compiled from source
    build:
      context: .
      dockerfile: Dockerfile.test
    cap_add:
      - SYS_ADMIN
    devices:
      - "/dev/fuse:/dev/fuse"
    security_opt:
      - apparmor:unconfined
    command: ["node", "test/node-mount-test.mjs"]
