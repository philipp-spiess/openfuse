name: CI

on: [push, pull_request]

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Unit tests (Bun)
        run: bun test packages/openfuse/test/core.test.ts

  e2e-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: node
            experimental: true
          - runtime: bun
            experimental: true

    continue-on-error: ${{ matrix.experimental }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FUSE + build tooling (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse-dev fuse3 pkg-config python3 make g++
          sudo modprobe fuse || true
          ls -l /dev/fuse || true

      - name: Install workspace dependencies (Bun)
        run: bun install --frozen-lockfile

      - name: Install fuse-native for Node backend
        if: matrix.runtime == 'node'
        run: |
          mkdir -p /tmp/openfuse-fuse-deps
          npm install --prefix /tmp/openfuse-fuse-deps fuse-native
          mkdir -p packages/@openfuse/fuse/node_modules
          rm -rf packages/@openfuse/fuse/node_modules/fuse-native
          ln -s /tmp/openfuse-fuse-deps/node_modules/fuse-native packages/@openfuse/fuse/node_modules/fuse-native

      - name: Build packages
        run: bun run build

      - name: Run e2e mount test (Node)
        if: matrix.runtime == 'node'
        run: |
          set -euo pipefail
          node tests/mount.e2e.ts > /tmp/openfuse-node-e2e.log 2>&1 &
          pid=$!
          deadline=$((SECONDS + 120))
          while kill -0 "$pid" 2>/dev/null; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Node e2e timed out after 120s"
              kill -9 "$pid" || true
              cat /tmp/openfuse-node-e2e.log || true
              exit 124
            fi
            sleep 1
          done
          set +e
          wait "$pid"
          status=$?
          set -e
          cat /tmp/openfuse-node-e2e.log || true
          exit "$status"

      - name: Run e2e mount test (Bun)
        if: matrix.runtime == 'bun'
        run: timeout 120s bun tests/mount.e2e.ts

  e2e-packaged-bun-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FUSE + build tooling (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse-dev fuse3 pkg-config python3 make g++
          sudo modprobe fuse || true
          ls -l /dev/fuse || true

      - name: Install workspace dependencies (Bun)
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Pack workspace packages
        run: |
          mkdir -p /tmp/openfuse-packs
          npm pack --pack-destination /tmp/openfuse-packs ./packages/@openfuse/fuse
          npm pack --pack-destination /tmp/openfuse-packs ./packages/openfuse
          ls -la /tmp/openfuse-packs

      - name: Install tarballs in clean consumer project
        run: |
          mkdir -p /tmp/openfuse-consumer
          cat > /tmp/openfuse-consumer/package.json <<'JSON'
          {
            "name": "openfuse-consumer-e2e",
            "private": true,
            "type": "module"
          }
          JSON

          cd /tmp/openfuse-consumer
          FUSE_TGZ=$(ls /tmp/openfuse-packs/openfuse-fuse-*.tgz | head -n 1)
          OPENFUSE_TGZ=$(ls /tmp/openfuse-packs/openfuse-[0-9]*.tgz | head -n 1)

          bun add "$FUSE_TGZ" "$OPENFUSE_TGZ"

          test -f node_modules/@openfuse/fuse/dist/bridge/fuse_bridge.so
          cp "$GITHUB_WORKSPACE/tests/mount.e2e.ts" ./mount.e2e.ts

      - name: Run packaged e2e mount test (Bun)
        run: |
          cd /tmp/openfuse-consumer
          timeout 120s env OPENFUSE_E2E_IMPORT=package bun ./mount.e2e.ts
