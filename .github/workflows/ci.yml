name: CI

on: [push, pull_request]

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Unit tests (Bun)
        run: bun test packages/openfuse/test/core.test.ts

  e2e-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: node
            experimental: true
          - runtime: bun
            experimental: true

    continue-on-error: ${{ matrix.experimental }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FUSE + build tooling (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse-dev fuse3 pkg-config python3 make g++
          sudo modprobe fuse || true
          ls -l /dev/fuse || true

      - name: Install workspace dependencies (Bun)
        run: bun install --frozen-lockfile

      - name: Install fuse-native for Node backend
        if: matrix.runtime == 'node'
        run: |
          mkdir -p /tmp/openfuse-fuse-deps
          npm install --prefix /tmp/openfuse-fuse-deps fuse-native
          mkdir -p packages/@openfuse/fuse/node_modules
          rm -rf packages/@openfuse/fuse/node_modules/fuse-native
          ln -s /tmp/openfuse-fuse-deps/node_modules/fuse-native packages/@openfuse/fuse/node_modules/fuse-native

      - name: Build Bun FFI bridge
        if: matrix.runtime == 'bun'
        run: |
          cc -shared -o packages/@openfuse/fuse/src/bridge/fuse_bridge.so packages/@openfuse/fuse/src/bridge/fuse_bridge.c \
            $(pkg-config --cflags --libs fuse) -fPIC -pthread

      - name: Build packages
        run: bun run build

      - name: Run e2e mount test (Node)
        if: matrix.runtime == 'node'
        run: |
          set -euo pipefail
          node tests/node-mount-test.ts > /tmp/openfuse-node-e2e.log 2>&1 &
          pid=$!
          deadline=$((SECONDS + 120))
          while kill -0 "$pid" 2>/dev/null; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Node e2e timed out after 120s"
              kill -9 "$pid" || true
              cat /tmp/openfuse-node-e2e.log || true
              exit 124
            fi
            sleep 1
          done
          wait "$pid"
          status=$?
          cat /tmp/openfuse-node-e2e.log || true
          exit "$status"

      - name: Run e2e mount test (Bun)
        if: matrix.runtime == 'bun'
        run: timeout 120s bun tests/node-mount-test.ts
